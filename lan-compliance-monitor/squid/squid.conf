# Squid config for LAN Compliance Monitor.
# Point client browsers/OS at this proxy (port 3128), e.g. via GPO
# "Proxy Settings" or WPAD, so every request is logged and category-filtered.

http_port 3128

# --- ACLs -------------------------------------------------------------
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16

acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl Safe_ports port 21          # ftp
acl Safe_ports port 1025-65535  # unregistered ports
acl CONNECT method CONNECT

# Category blocklists — one domain per line, generated/maintained by
# collector/update_blocklists.py from domain_categories where is_blocked=true.
acl blocked_gambling dstdomain "/etc/squid/blocklists/gambling.txt"
acl blocked_adult dstdomain "/etc/squid/blocklists/adult.txt"
acl blocked_malware dstdomain "/etc/squid/blocklists/malware.txt"
acl blocked_proxyvpn dstdomain "/etc/squid/blocklists/proxy-vpn.txt"
acl blocked_filesharing dstdomain "/etc/squid/blocklists/file-sharing.txt"

# --- Access rules -------------------------------------------------------
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

http_access deny blocked_gambling
http_access deny blocked_adult
http_access deny blocked_malware
http_access deny blocked_proxyvpn
http_access deny blocked_filesharing

http_access allow localhost manager
http_access deny manager

http_access allow localnet
http_access deny all

# --- Logging (parsed by collector/ingest_squid_logs.py) ----------------
access_log /var/log/squid/access.log squid
logfile_rotate 10
cache_log /var/log/squid/cache.log

# Reasonable default cache sizing; tune for your hardware.
cache_dir ufs /var/spool/squid 1000 16 256
coredump_dir /var/spool/squid
