# Local development stack: PostgreSQL, an Azure Storage emulator (Azurite) and the API.
#   docker compose up --build
#   python3 scripts/dev-token.py --role Admin      # a development token for the API (see docs/deployment.md)
# The web app and mobile app run on the host:  cd src/web && npm run dev
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: das_engage }
    ports: ["5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d das_engage"], interval: 5s, timeout: 3s, retries: 20 }

  blobs:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports: ["10000:10000"]

  migrate:
    build: { context: ., dockerfile: src/backend/Dockerfile }
    command: ["migrate"]
    environment:
      ConnectionStrings__Default: Host=db;Database=das_engage;Username=postgres;Password=postgres
      ASPNETCORE_ENVIRONMENT: Development
    depends_on: { db: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: src/backend/Dockerfile }
    ports: ["5111:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development            # enables the development signing key below; never set this in a real environment
      ConnectionStrings__Default: Host=db;Database=das_engage;Username=postgres;Password=postgres
      Auth__DevSigningKey: dev-only-signing-key-change-me-0123456789abcdef
      Storage__Provider: azure
      Storage__ConnectionString: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://blobs:10000/devstoreaccount1;
      Cors__AllowedOrigins__0: http://localhost:5173
      Erp__Worker__Enabled: "false"
    depends_on:
      migrate: { condition: service_completed_successfully }
      blobs: { condition: service_started }

volumes:
  dbdata:
