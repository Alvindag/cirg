version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/backend
    schedule: { interval: weekly }
    groups:
      microsoft: { patterns: ["Microsoft.*", "System.*"] }
      azure: { patterns: ["Azure.*"] }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /src/web
    schedule: { interval: weekly }
    groups:
      react: { patterns: ["react", "react-dom", "react-router-dom", "@types/react*"] }
      tooling: { patterns: ["vite", "vitest", "@vitejs/*", "typescript", "oxlint", "@testing-library/*", "jsdom"] }
    open-pull-requests-limit: 5
  - package-ecosystem: pub
    directory: /src/mobile
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /src/backend
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
