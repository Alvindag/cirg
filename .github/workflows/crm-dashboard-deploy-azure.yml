# Manual only. Nothing deploys until someone runs this from the Actions tab,
# after the one-time Azure setup in crm-dashboard/docs/azure-deployment.md.
name: crm-dashboard deploy to Azure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm this goes to the live site'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: crm-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crm-dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Assemble the standalone package
        run: |
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: crm-dashboard/.next/standalone
