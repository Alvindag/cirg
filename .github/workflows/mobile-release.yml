name: Mobile release

# Builds signed release artifacts when a version tag is pushed (for example mobile-v1.2.0).
# Android is the primary target. The iOS job is provided as a starting point and has not been exercised.
on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: mobile-release
    defaults:
      run:
        working-directory: src/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze && flutter test
      - name: Signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to ship a debug-signed build"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > android/key.properties
      - name: Build the app bundle
        run: >
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --dart-define=API_BASE_URL=${{ vars.MOBILE_API_BASE_URL }}
          --dart-define=ENTRA_CLIENT_ID=${{ vars.ENTRA_MOBILE_CLIENT_ID }}
          --dart-define=ENTRA_TENANT=${{ vars.ENTRA_TENANT }}
          --dart-define=API_SCOPE=${{ vars.ENTRA_API_SCOPE }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: src/mobile/build/app/outputs/bundle/release/*.aab

  ios:
    runs-on: macos-14
    timeout-minutes: 45
    environment: mobile-release
    defaults:
      run:
        working-directory: src/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
      # Signing needs a distribution certificate and provisioning profile; without them this produces an unsigned archive only.
      - name: Build (unsigned)
        run: >
          flutter build ios --release --no-codesign
          --dart-define=API_BASE_URL=${{ vars.MOBILE_API_BASE_URL }}
          --dart-define=ENTRA_CLIENT_ID=${{ vars.ENTRA_MOBILE_CLIENT_ID }}
          --dart-define=ENTRA_TENANT=${{ vars.ENTRA_TENANT }}
          --dart-define=API_SCOPE=${{ vars.ENTRA_API_SCOPE }}
