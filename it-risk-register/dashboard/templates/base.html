<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}IT Risk Register{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <div class="brand">IT Risk Register</div>
        <a href="/">Overview</a>
        <a href="/assets">Assets</a>
        <a href="/vulnerabilities">Vulnerabilities</a>
        <a href="/recommendations">Recommendations</a>
        <a href="/import">Import Scan</a>
        <a class="nav-cta" href="/assets/new">+ Add asset</a>
    </nav>
    <main>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash">
            {% for m in messages %}<div>{{ m }}</div>{% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
